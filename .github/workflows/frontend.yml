name: "Frontend check and deploy"

on:
  push:
    branches:
      - release

env:
  IMAGE: ghcr.io/igor-526/moneyhelper-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install deps
        run: npm install

      - name: lint
        run: make lint

      - name: test
        run: make test

  build_deploy:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
    
      - uses: azure/setup-helm@v4

      - name: Deploy
        run: |
          helm upgrade --install moneyhelper-frontend .helm/ \
            --namespace moneyhelper \
            --create-namespace \
            --set imageTag=${{ github.sha }} \
            --wait
