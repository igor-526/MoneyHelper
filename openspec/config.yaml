schema: spec-driven

context: |
  Проект: MoneyHelper — личное приложение для ведения финансов в Китае. Монорепозиторий: backend (FastAPI) и
  frontend (React). Приложение в основном используется на телефоне.

  Язык: ВСЕ артефакты OpenSpec (proposal, specs, design, tasks) и всё общение агентов — только на русском.
  Исключения, которые остаются на английском: структурные ключевые слова формата OpenSpec
  (`## ADDED Requirements`, `### Requirement:`, `#### Scenario:`, `WHEN`, `THEN`, `AND`, `SHALL`, `MUST`),
  идентификаторы кода, имена файлов, команды и общепринятые технические термины.

  Frontend: React + TypeScript, полностью CSR, UI — Ant Design (mobile-first, светлая и тёмная темы), PWA (кэшируется
  только оболочка, API не кэшируется). Авторизация реализована (изменение backend-auth): регистрация (флаг
  REGISTRATION_ENABLED), вход, выход, смена пароля; JWT access/refresh без хранения токенов на сервере (отзыв через
  token_version), время жизни в .env, токены только в cookies (backend ставит и читает их сам); на frontend —
  защищённые маршруты (RequireAuth/GuestOnly) и автообновление сессии. Валюты реализованы (изменение currencies-seeding):
  глобальный справочник (CNY, RUB, USDT), сидируется при старте приложения (lifespan) из JSON с явными UUID, не
  миграциями, upsert по id без удаления; переиспользуемый механизм сидирования в utils/seeding.py (advisory lock)
  рассчитан на будущие справочники. Категории — плоский список. Удаление — физическое.
  Iconpack реализован (изменение iconpack): закрытый курируемый реестр имён иконок Lucide (23 штуки, kebab-case) в
  backend/src/core/icons.json — единственный источник правды, не таблица БД; core/icons.py строит ALLOWED_ICONS,
  core/schemas/icon.py даёт переиспользуемый тип IconName; GET /api/icons отдаёт список без авторизации. Frontend
  не запрашивает список по сети (статическая карта имя → компонент для PWA precache/tree-shaking), а
  синхронизируется vitest-тестом, читающим тот же JSON с диска.
  Кошельки реализованы (изменение wallets): таблицы wallets и wallet_currencies (M2M к currencies, составной PK,
  ON DELETE CASCADE у user_id/wallet_id, ON DELETE RESTRICT у currency_id), миграция 20260929_0004. WalletRepository
  фильтрует по wallet_id И user_id в одном запросе — чужой кошелёк везде 404, никогда 403. CRUD через
  /api/wallets* под авторизацией; PUT — только полная замена name/icon/currency_ids (без PATCH); иконка проверяется
  IconName, валюты — новым методом CurrencyRepository.missing_ids. Удаление кошелька физическое и безусловное —
  задел на защиту от операций (010) зафиксирован в design.md изменения wallets, не реализован.
  Дорожная карта: docs/tasks/002_roadmap.md; задачи: docs/tasks/003_*.md … 012_*.md.
  Архитектура обязательно следует SOLID по правилам из AGENTS.md.

  Стек backend: Python 3.14, FastAPI, SQLAlchemy Core + asyncpg, PostgreSQL, Alembic, uv, pytest,
  ruff, flake8, mypy. Архитектура — Clean Architecture; структура и паттерны описаны в AGENTS.md
  (читай его перед проектированием и реализацией).

  Предметная область:
  - Пользователи ведут собственные кошельки (UPay USDT, Alipay CNY, WeChatPay CNY, NihaoChina CNY,
    наличные RUB и др.), категории и операции; эти данные изолированы между пользователями.
    Валюты — общий глобальный справочник, из которого кошельки берут свои валюты.
  - У кошелька одна или несколько валют. При пополнении кошелька с несколькими валютами обязательно
    указываются все его валюты — это нужно для расчёта курса.
  - Категории делятся на доходы и расходы. Иконки есть у категорий и кошельков; иконка хранится в БД как
    имя иконки Lucide (iconpack общий для backend и frontend).
  - Каждый доход и расход привязан к конкретному кошельку.
  - Пополнение — это доход; возможен также перевод между кошельками, у которых есть хотя бы одна общая валюта.
  - Аналитика доходов и расходов в разных разрезах; валюта отображения выбирается GET-параметром, курс —
    средний за диапазон анализа.

  QualityGate (обязателен для каждой задачи; команды покрывают backend и frontend): `make format`, затем
  `make lint`, затем `make test` (backend: unit- и smoke-тесты; frontend: vitest). Задача не считается выполненной, пока все три команды не проходят.

rules:
  proposal:
    - Писать на русском языке.
    - Явно указывать, какие части API и БД затрагиваются и нужна ли миграция Alembic.
    - Включать раздел «Вне рамок» (Non-goals).
  specs:
    - Писать на русском языке; ключевые слова SHALL/MUST, WHEN/THEN и заголовки формата OpenSpec оставлять на английском.
    - Описывать требования и сценарии с точки зрения поведения API (запрос, ответ, коды ошибок, изоляция данных между пользователями).
  design:
    - Писать на русском языке.
    - Следовать структуре и паттернам из AGENTS.md; отклонения обосновывать.
    - Для изменений БД описывать таблицы, ограничения и миграцию.
  tasks:
    - Писать на русском языке.
    - Задачи должны быть небольшими и проверяемыми, включая написание unit- и smoke-тестов.
    - Последняя группа задач — прогон QualityGate (`make format`, `make lint`, `make test`).
