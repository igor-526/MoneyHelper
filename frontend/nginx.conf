server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # index.html, service worker и манифест не кэшируются — иначе клиент не узнает о новой версии (баннер
    # обновления PWA, shared/pwa/usePwaUpdate.ts, опирается на свежий sw.js при каждой загрузке).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Хэшированные ассеты (Vite fingerprint в имени файла) — кэшируются навсегда, смена контента = смена имени.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: неизвестные пути (client-side routing, react-router) отдают index.html вместо 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
